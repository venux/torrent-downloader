<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" />
  <title>TorrentDock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-platform="win32">

<svg class="sprite" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24">
    <path d="M12 3.2v10.2m0 0 4-4.1m-4 4.1-4-4.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4.6 15.4v2.6a2.4 2.4 0 0 0 2.4 2.4h10a2.4 2.4 0 0 0 2.4-2.4v-2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-magnet" viewBox="0 0 24 24">
    <path d="M5 4v6a7 7 0 0 0 14 0V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M5 9h4M15 9h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-paste" viewBox="0 0 24 24">
    <rect x="6" y="4" width="12" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M9.5 4.5V3.8A1.3 1.3 0 0 1 10.8 2.5h2.4a1.3 1.3 0 0 1 1.3 1.3v.7z" fill="currentColor"/>
  </symbol>
  <symbol id="i-pause" viewBox="0 0 24 24">
    <rect x="7" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/>
    <rect x="13.4" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24">
    <path d="M8 5.6v12.8c0 .9 1 1.4 1.7.9l9.2-6.4c.6-.4.6-1.4 0-1.8L9.7 4.7c-.7-.5-1.7 0-1.7.9z" fill="currentColor"/>
  </symbol>
  <symbol id="i-folder" viewBox="0 0 24 24">
    <path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.2l1.8 2.2h8A2 2 0 0 1 20.5 9.7v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M4.5 7h15M9.5 7V5.2c0-.7.6-1.2 1.2-1.2h2.6c.7 0 1.2.5 1.2 1.2V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M6.6 7l.8 11.3c0 .9.8 1.7 1.7 1.7h5.8c.9 0 1.7-.8 1.7-1.7L17.4 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="10.5" height="10.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M15 6.2A2.2 2.2 0 0 0 12.8 4H6.7A2.2 2.2 0 0 0 4.5 6.2v6.1A2.2 2.2 0 0 0 6.7 14.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M19.4 14.3a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H2.2a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V2.2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-file" viewBox="0 0 24 24">
    <path d="M13.4 3.5H7.2a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2V8.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M13.2 3.6v5.2h5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24">
    <path d="M13.2 2.5 5.4 13.2h5.2l-1 8.3 7.9-10.8h-5.2z" fill="currentColor"/>
  </symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"><svg viewBox="0 0 24 24"><use href="#i-logo"/></svg></span>
    <span class="brand-name">TorrentDock</span>
    <span class="bridge-badge" id="bridge-badge" title="Chrome 扩展连接端口">
      <span class="bridge-dot"></span><span id="bridge-port">…</span>
    </span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="btn-theme" title="切换主题">
      <svg viewBox="0 0 24 24" id="theme-icon"><use href="#i-sun"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="设置">
      <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-filter="all">
        <span class="nav-label">全部任务</span><span class="nav-count" data-count="all">0</span>
      </button>
      <button class="nav-item" data-filter="downloading">
        <span class="nav-label">下载中</span><span class="nav-count" data-count="downloading">0</span>
      </button>
      <button class="nav-item" data-filter="done">
        <span class="nav-label">已完成</span><span class="nav-count" data-count="done">0</span>
      </button>
      <button class="nav-item" data-filter="paused">
        <span class="nav-label">已暂停</span><span class="nav-count" data-count="paused">0</span>
      </button>
    </nav>

    <div class="side-stats">
      <div class="stat-row">
        <span class="stat-key">下载</span><span class="stat-val stat-down" id="speed-down">0 B/s</span>
      </div>
      <div class="stat-row">
        <span class="stat-key">上传</span><span class="stat-val stat-up" id="speed-up">0 B/s</span>
      </div>
      <div class="side-note">本地桥接 127.0.0.1:<span id="side-port">…</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="addbar">
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24"><use href="#i-magnet"/></svg>
        <input id="add-input" type="text" spellcheck="false" autocomplete="off"
               placeholder="粘贴磁力链接 magnet:?xt=… 或 .torrent 直链" />
      </div>
      <button class="btn btn-primary" id="btn-add">
        <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>添加
      </button>
      <button class="btn btn-ghost" id="btn-file">
        <svg viewBox="0 0 24 24"><use href="#i-file"/></svg>种子文件
      </button>
      <button class="btn btn-ghost btn-icon" id="btn-paste" title="从剪切板读取">
        <svg viewBox="0 0 24 24"><use href="#i-paste"/></svg>
      </button>
    </div>

    <div class="clip-tip" id="clip-tip" hidden>
      <span class="clip-icon"><svg viewBox="0 0 24 24"><use href="#i-bolt"/></svg></span>
      <div class="clip-body">
        <strong>剪切板里发现一个磁力链接</strong>
        <span id="clip-text" class="clip-text"></span>
      </div>
      <div class="clip-actions">
        <button class="btn btn-sm btn-primary" id="clip-add">添加</button>
        <button class="btn btn-sm btn-ghost" id="clip-ignore">忽略</button>
      </div>
    </div>

    <div class="list-head">
      <h2 id="list-title">全部任务</h2>
      <span class="list-hint" id="list-hint"></span>
    </div>

    <div class="torrent-list" id="torrent-list"></div>

    <div class="empty" id="empty">
      <div class="empty-art">
        <svg viewBox="0 0 24 24"><use href="#i-logo"/></svg>
      </div>
      <h3>还没有下载任务</h3>
      <p>把磁力链接粘到上面的输入框，或直接把 <b>.torrent</b> 文件拖进窗口。</p>
      <p class="empty-sub">开启监听剪切板后，复制链接就会自动提示。</p>
    </div>
  </main>
</div>

<div class="drop-overlay" id="drop-overlay" hidden>
  <div class="drop-inner">
    <svg viewBox="0 0 24 24"><use href="#i-logo"/></svg>
    <span>松手，立刻开始下载</span>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-label="设置">
    <header class="modal-head">
      <h2>设置</h2>
      <button class="icon-btn" id="modal-close" title="关闭"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </header>

    <div class="modal-body">
      <div class="field">
        <label class="field-label">下载目录</label>
        <div class="field-row">
          <input type="text" id="set-path" readonly />
          <button class="btn btn-sm btn-ghost" id="btn-browse">浏览…</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Chrome 扩展桥接端口</label>
        <div class="field-row">
          <input type="number" id="set-port" min="1024" max="65535" step="1" />
          <span class="field-hint">扩展里填同样的端口</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label">最大连接数</label>
        <div class="field-row">
          <input type="number" id="set-conns" min="10" max="500" step="10" />
          <span class="field-hint">重启后生效</span>
        </div>
      </div>

      <div class="field field-switch">
        <div>
          <label class="field-label">监听剪切板</label>
          <p class="field-desc">复制磁力链接后，应用内浮出提示条</p>
        </div>
        <label class="switch"><input type="checkbox" id="set-watch" /><span class="slider"></span></label>
      </div>

      <div class="field field-switch">
        <div>
          <label class="field-label">剪切板自动添加</label>
          <p class="field-desc">不做确认，复制即入队（有点激进）</p>
        </div>
        <label class="switch"><input type="checkbox" id="set-auto" /><span class="slider"></span></label>
      </div>

      <div class="field field-switch">
        <div>
          <label class="field-label">完成后继续做种</label>
          <p class="field-desc">关闭则下载完立即断开连接</p>
        </div>
        <label class="switch"><input type="checkbox" id="set-seed" /><span class="slider"></span></label>
      </div>

      <div class="field field-switch">
        <div>
          <label class="field-label">外观</label>
          <p class="field-desc">跟随系统 / 固定浅色 / 固定深色</p>
        </div>
        <div class="segmented" id="set-theme">
          <button data-theme-value="system">跟随</button>
          <button data-theme-value="light">浅色</button>
          <button data-theme-value="dark">深色</button>
        </div>
      </div>
    </div>

    <footer class="modal-foot">
      <span class="modal-hint">TorrentDock v<span id="app-version">1.0.0</span></span>
      <button class="btn btn-primary" id="modal-done">完成</button>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
